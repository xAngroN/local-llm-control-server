# Werte 1:1 portiert aus dem bestehenden `qwen`-Shellskript des Hosts.
# Dieses Skript liegt NICHT in diesem Repository, deshalb müssen die
# Zahlenwerte (ctx_size, batch_size, kv_cache_type_k/v, extra_args) vor dem
# Cutover gegen die Hostkopie des qwen-Skripts verifiziert werden.
# TODO(port): gegen qwen-Skript verifizieren

[common]
image = "docker.io/ggml-org/llama.cpp:server-vulkan"
models_dir = "/var/home/bazzite/models"
container_name = "llamactl-model"
host_port = 8080
extra_args = ["-ngl", "999", "-fa", "on", "--jinja", "--draft-max", "4", "--draft", "0"]

[profiles.fast]
model = "fast.gguf"
ctx_size = 16384
kv_cache_type_k = "f16"
kv_cache_type_v = "f16"
parallel = 1
batch_size = 2048

[profiles.large]
model = "large.gguf"
ctx_size = 65536
kv_cache_type_k = "q8_0"
kv_cache_type_v = "q8_0"
parallel = 1
batch_size = 1024

[profiles.safe]
model = "safe.gguf"
ctx_size = 32768
kv_cache_type_k = "q8_0"
kv_cache_type_v = "q8_0"
parallel = 1
batch_size = 512

# `shared` teilt das bereits gemessene 32768-Token-Budget auf 4 Slots zu je
# 8192 Token auf, statt ein neues, unvermessenes Speicherbudget aufzumachen;
# der reale VRAM-Spitzenwert dieses Profils ist noch nicht gemessen.
[profiles.shared]
model = "safe.gguf"
ctx_size = 32768
kv_cache_type_k = "q8_0"
kv_cache_type_v = "q8_0"
parallel = 4
batch_size = 512
