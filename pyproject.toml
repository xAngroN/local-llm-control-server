[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "llamactl"
version = "0.1.0"
description = "Control server for local LLM inference via llama.cpp (podman)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "httpx",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
]

[project.scripts]
llamactl = "llamactl.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/llamactl"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
